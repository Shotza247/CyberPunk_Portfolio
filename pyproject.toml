[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongodb-vector-test-ui"
version = "0.2.0"
description = "FastAPI MongoDB RAG service with reusable retrieval and evaluation UIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.13,<2.14",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "pymongo>=4.8",
  "pypdf>=5.0",
  "requests>=2.32",
]

[project.optional-dependencies]
orchestration = [
  "langchain>=1.0",
  "langgraph>=1.0",
]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
xai = ["langchain-xai>=1.0"]
deepseek = ["langchain-deepseek>=1.0"]
ui = ["streamlit>=1.57"]
mvp2 = [
  "langchain>=1.0",
  "langgraph>=1.0",
  "langchain-openai>=1.0",
  "langchain-anthropic>=1.0",
  "langchain-xai>=1.0",
  "langchain-deepseek>=1.0",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
